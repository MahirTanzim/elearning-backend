spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/elearning
    username: postgres
    password: 1234
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email

server:
  port: 8080

app:
  frontend-url: http://localhost:5173
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@elearning.local}
  tokens:
    verification-hours: 24
    reset-minutes: 30
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-it-must-be-32-bytes-or-more}
    access-token-minutes: 15
    refresh-token-days: 7